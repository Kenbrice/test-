
name: Test GitHub Storage

on:
  workflow_dispatch:

jobs:
  test-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Create test file
        run: echo "GitHub storage test successful" > test.txt

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: storage-test
          path: test.txt
          retention-days: 1
